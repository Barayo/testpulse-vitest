name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20"]
        vitest-version: ["4", "5"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Pin vitest test matrix version
        # --legacy-peer-deps: vitest 5 requires @types/node ^22 || >=24
        # as a peerOptional, which strict peer resolution refuses to
        # reconcile against this project's own @types/node ^20 (a real,
        # version-specific conflict found running this exact matrix
        # locally, not a hypothetical one).
        run: npm install --no-save --legacy-peer-deps "vitest@^${{ matrix.vitest-version }}"
      - run: npm run build
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run test:e2e -- --ci
