name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20"]
        vitest-version: ["4", "5"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Upgrade npm (matches the npm major the committed package-lock.json was generated with; an older bundled npm crashes with "Cannot read properties of null (reading 'edgesOut')" building the ideal tree)
        run: npm install -g npm@11
      - run: npm ci
      - name: Pin vitest test matrix version
        run: npm install --no-save "vitest@^${{ matrix.vitest-version }}"
      - run: npm run build
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run test:e2e -- --ci
